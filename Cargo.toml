[package]
name = "univers"
version = "0.1.0"
edition = "2021"
authors = ["8b-is"]
description = "NVIDIA Omniverse + Smart Tree + Foken integration"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
